<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">电赛庐山派 K230 钢珠识别开源模型</title>
  <desc id="desc">钢珠识别模型宣传图，标注真实现场、合成场景和 K230 实拍负样本的训练集来源。</desc>
  <rect width="1280" height="640" fill="#f3d98f"/>
  <rect x="48" y="48" width="1184" height="544" rx="6" fill="#fff7df" stroke="#33251d" stroke-width="3"/>
  <path d="M48 176H1232" stroke="#33251d" stroke-width="3"/>
  <text x="84" y="105" fill="#a8452d" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">ELECTRONIC DESIGN CONTEST · OPEN SOURCE V1</text>
  <text x="84" y="153" fill="#33251d" font-family="serif" font-size="48" font-weight="700">庐山派 K230 钢珠识别开源模型</text>
  <text x="84" y="223" fill="#745a48" font-family="sans-serif" font-size="22">YOLO11n · 1024 × 1024 · 多目标框选 · UART 中心坐标输出</text>
  <g transform="translate(84 274)">
    <circle cx="88" cy="88" r="74" fill="#4c4940"/>
    <circle cx="68" cy="65" r="22" fill="#8d8b83" opacity=".9"/>
    <circle cx="108" cy="110" r="16" fill="#26231f" opacity=".7"/>
    <rect x="4" y="4" width="168" height="168" fill="none" stroke="#d96e4a" stroke-width="6"/>
    <text x="0" y="211" fill="#a8452d" font-family="monospace" font-size="18" font-weight="700">DETECT / TRACK / SEND</text>
  </g>
  <g transform="translate(360 275)" font-family="sans-serif">
    <text x="0" y="0" fill="#33251d" font-size="20" font-weight="700">训练集来源</text>
    <path d="M0 20H710" stroke="#d8bd78" stroke-width="2"/>
    <text x="0" y="64" fill="#a8452d" font-size="18" font-weight="700">01</text>
    <text x="50" y="64" fill="#33251d" font-size="20">K230 现场真实采集</text>
    <text x="50" y="94" fill="#745a48" font-size="17">真实现场图 237 张 + YOLO 标签</text>
    <text x="0" y="145" fill="#a8452d" font-size="18" font-weight="700">02</text>
    <text x="50" y="145" fill="#33251d" font-size="20">合成场景 synth_field</text>
    <text x="50" y="175" fill="#745a48" font-size="17">3000 张 + YOLO 标签</text>
    <text x="0" y="226" fill="#a8452d" font-size="18" font-weight="700">03</text>
    <text x="50" y="226" fill="#33251d" font-size="20">本项目 K230 实拍负样本</text>
    <text x="50" y="256" fill="#745a48" font-size="17">孔板 / 暗场，抑制误报</text>
  </g>
  <path d="M84 545H1196" stroke="#33251d" stroke-width="2"/>
  <text x="84" y="573" fill="#745a48" font-family="monospace" font-size="17">github.com/37chengshan/k230-steel-ball-detector</text>
  <text x="1190" y="573" text-anchor="end" fill="#a8452d" font-family="monospace" font-size="17">K230 / CanMV</text>
</svg>
